name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-and-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test adapters and documentation link contracts
        run: node --test tests/*.test.mjs
      - name: Check repository Markdown links offline
        run: node scripts/check-doc-links.mjs
