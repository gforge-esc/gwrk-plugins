type: agent
name: gemini
version: 1.0.0
description: Google Gemini CLI standalone adapter
adapter: ./adapter.js
dispatchMode: local-cli
contextFileName: GEMINI.md
invocation:
  command: gemini
  args: ["-p", "Follow the instructions provided on stdin.", "--yolo", "--output-format", "stream-json"]
  headlessFlag: "-p"
  yoloFlag: "--yolo"
capabilities:
  - code-generation
  - refactoring
  - analysis
  - long-context
models:
  default: gemini-2.5-pro
  fast: gemini-2.5-flash
  pro: gemini-2.5-pro
exitCodeMap:
  "0":
    exitCode: 0
  "1":
    exitCode: 1
    errorType: gate_failure
  "42":
    exitCode: 2
    errorType: usage_error
  "53":
    exitCode: 1
    errorType: turn_limit
  "127":
    exitCode: 127
    errorType: not_found
managedConfig:
  - path: ".gemini/settings.json"
    keys:
      - "general.defaultApprovalMode"
      - "tools.sandbox"
      - "model.maxSessionTurns"
