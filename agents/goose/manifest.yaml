type: agent
name: goose
version: 1.0.1
description: Block Goose CLI autonomous developer agent adapter
adapter: ./adapter.js
dispatchMode: local-cli
contextFileName: .goosehints
invocation:
  command: goose
  args: ["run", "--with-builtin", "developer", "-i", "-"]
  headlessFlag: "run"
capabilities:
  - code-generation
  - refactoring
  - analysis
models:
  default: claude-sonnet-4-5
  fast: claude-haiku-4-5
  pro: claude-opus-4-5
exitCodeMap:
  "0":
    exitCode: 0
  "1":
    exitCode: 1
    errorType: gate_failure
  "2":
    exitCode: 2
    errorType: usage_error
  "127":
    exitCode: 127
    errorType: not_found
managedConfig: []
